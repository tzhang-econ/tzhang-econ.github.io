# ASU Theme
# Arizona State University colors: Maroon (#8C1D40) and Gold (#FFC627)

[light]
  # Primary
  primary = "#8C1D40"

  # Menu
  menu_primary = "#8C1D40"
  menu_text = "#fff"
  menu_text_active = "#FFC627"
  menu_title = "#fff"

  # Page sections. Both the same: the alternating stripe suited a single
  # scrolling page, but reads as a seam now that each page is its own.
  home_section_odd = "#fff"
  home_section_even = "#fff"

[dark]
  # Primary
  primary = "#FFC627"

  # Page background. Without this the theme falls back to a blue-grey default,
  # which does not match the neutral section colours below.
  background = "#1a1a1a"

  # Menu
  menu_primary = "#1a1a1a"
  menu_text = "#fff"
  menu_text_active = "#FFC627"
  menu_title = "#FFC627"

  # Page sections, uniform to match the light theme.
  home_section_odd = "#1a1a1a"
  home_section_even = "#1a1a1a"
